<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visor XR · Ferruz</title>
<style>
  html,body{margin:0;height:100%;background:#1b1b1f;color:#eee;font-family:system-ui,Segoe UI,Arial,sans-serif;overflow:hidden}
  #hud{position:absolute;top:12px;left:12px;right:12px;display:flex;gap:8px;flex-wrap:wrap;align-items:center;z-index:5}
  #hud h1{font-size:18px;margin:0 12px 0 0;color:#e30613}
  button{background:#e30613;color:#fff;border:0;border-radius:8px;padding:10px 16px;font-size:15px;cursor:pointer}
  button.sec{background:#3a3a42}
  #info{position:absolute;bottom:12px;left:12px;right:12px;font-size:14px;opacity:.85;z-index:5}
  #load{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px;z-index:4;pointer-events:none}
</style>
<script type="importmap">
{"imports":{
  "three":"./lib/three.module.js",
  "three/addons/":"./lib/addons/"
}}
</script>
</head>
<body>
<div id="hud">
  <a href="index.html" style="color:#fff;text-decoration:none;font-size:15px;margin-right:6px">← Catálogo</a><h1>FERRUZ · Visor XR</h1>
  <button id="btnAR">Entrar en realidad mixta</button>
  <button id="btnScale" class="sec">Escala: 1:1</button>
  <button id="btnRot" class="sec">Girar 90°</button>
</div>
<div id="load">Cargando modelo…</div>
<div id="info">
  En las Quest 3: pulsa «Entrar en realidad mixta», apunta al suelo con el mando y pulsa el gatillo para colocar el modelo.
  Gatillo de nuevo = recolocar · Joystick derecho = girar · Botón A = cambiar escala 1:1 / 1:10.
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { MeshoptDecoder } from 'three/addons/libs/meshopt_decoder.module.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoomEnvironment } from 'three/addons/environments/RoomEnvironment.js';
import { ensureKey, fetchDecrypted } from './lib/gate.js';

const params = new URLSearchParams(location.search);
const MODEL_URL = 'models/' + (params.get('m') || 'piso-movil').replace(/[^a-z0-9-]/gi, '') + '.glb.enc';
const EMBED = params.has('embed');
if (EMBED) { document.getElementById('hud').style.display='none'; document.getElementById('info').style.display='none'; }
const SCALES = [1, 0.1];
let scaleIdx = 0;

const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.xr.enabled = true;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, innerWidth / innerHeight, 0.05, 500);
camera.position.set(12, 6, 12);

// Render fotorrealista: tone mapping + reflejos de entorno
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.0;
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.shadowMap.autoUpdate = false;   // sombra estática: se calcula una vez (rendimiento en Quest)
const pmrem = new THREE.PMREMGenerator(renderer);
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture;
scene.environmentIntensity = 0.9;

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 0.6));
const sun = new THREE.DirectionalLight(0xfff4e5, 2.4);
sun.position.set(8, 18, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.bias = -0.0005;
sun.shadow.normalBias = 0.02;
scene.add(sun, sun.target);

// Suelo que solo recibe sombra (funciona también sobre el passthrough)
const shadowFloor = new THREE.Mesh(new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2),
  new THREE.ShadowMaterial({ opacity: 0.45 }));
shadowFloor.receiveShadow = true;

// Fondo y rejilla solo en el navegador del PC
const grid = new THREE.GridHelper(40, 40, 0x666666, 0x333333);
grid.position.y = -0.002;
scene.add(grid);
scene.background = new THREE.Color(0x1b1b1f);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.5, 0);
controls.update();

// Pivote: el modelo se apoya en el suelo, centrado en X/Z
const pivot = new THREE.Group();
scene.add(pivot);

const loader = new GLTFLoader();
loader.setMeshoptDecoder(MeshoptDecoder);
function onModel(gltf) {
  const m = gltf.scene;
  // Materiales por pieza (aluminio, neumático, llanta, acero, zincado, plástico) vienen en el modelo
  m.traverse(o => { if (o.isMesh) { o.castShadow = true; o.material.side = THREE.DoubleSide; } });
  const box = new THREE.Box3().setFromObject(m);
  const c = box.getCenter(new THREE.Vector3());
  m.position.sub(new THREE.Vector3(c.x, box.min.y, c.z));
  pivot.add(m);
  const size = box.getSize(new THREE.Vector3());
  // Sombra sobre el suelo
  shadowFloor.scale.set(size.x * 1.6, 1, size.z * 3);
  pivot.add(shadowFloor);
  const R = Math.max(size.x, size.z) * 0.7;
  Object.assign(sun.shadow.camera, { left: -R, right: R, top: R, bottom: -R, near: 0.5, far: 60 });
  sun.shadow.camera.updateProjectionMatrix();
  renderer.shadowMap.needsUpdate = true;
  document.getElementById('load').remove(); window.__loaded = true; window.__scene = scene; window.__view = (p, t) => { camera.position.set(...p); controls.target.set(...t); controls.update(); };
  document.getElementById('info').insertAdjacentText('beforeend',
    ` · Largo × ancho × alto: ${size.x.toFixed(2)} × ${size.z.toFixed(2)} × ${size.y.toFixed(2)} m`);
  const d = Math.max(size.x, size.z);
  camera.position.set(d * 0.8, d * 0.4, d * 0.8);
  controls.target.set(0, size.y / 2, 0);
  controls.update();
  if (EMBED) { controls.autoRotate = true; controls.autoRotateSpeed = 0.8; }
}
// Modelo cifrado: se pide la contraseña (si no está guardada), se descarga y se descifra en el navegador
(async () => {
  try {
    await ensureKey('app/check.enc');
    const buf = await fetchDecrypted(MODEL_URL, (got, total) => {
      if (total) document.getElementById('load').textContent = `Cargando modelo… ${Math.round(got / total * 100)} %`;
    });
    document.getElementById('load').textContent = 'Preparando modelo…';
    loader.parse(buf, '', onModel, (err) => { throw err; });
  } catch (err) {
    document.getElementById('load').textContent = 'No se pudo cargar el modelo';
    console.error(err);
  }
})();

function updateShadow() {
  sun.target.position.copy(pivot.position);
  sun.position.copy(pivot.position).add(new THREE.Vector3(8, 18, 6));
  sun.target.updateMatrixWorld();
  renderer.shadowMap.needsUpdate = true;
}
function setScale(i) {
  scaleIdx = i;
  pivot.scale.setScalar(SCALES[i]);
  document.getElementById('btnScale').textContent = `Escala: ${SCALES[i] === 1 ? '1:1' : '1:10'}`;
  updateShadow();
}
function rotate(rad) { pivot.rotation.y += rad; updateShadow(); }
document.getElementById('btnScale').onclick = () => setScale((scaleIdx + 1) % SCALES.length);
document.getElementById('btnRot').onclick = () => rotate(Math.PI / 2);

// ---------- Realidad mixta (WebXR immersive-ar con hit-test) ----------
const reticle = new THREE.Mesh(
  new THREE.RingGeometry(0.15, 0.2, 32).rotateX(-Math.PI / 2),
  new THREE.MeshBasicMaterial({ color: 0xe30613 })
);
reticle.matrixAutoUpdate = false;
reticle.visible = false;
scene.add(reticle);

let hitSource = null, placed = false;
const controller = renderer.xr.getController(0);
const controller2 = renderer.xr.getController(1);
scene.add(controller, controller2);
function onSelect() {
  if (!reticle.visible) return;
  const p = new THREE.Vector3().setFromMatrixPosition(reticle.matrix);
  pivot.position.copy(p);
  pivot.visible = true;
  placed = true;
  updateShadow();
}
controller.addEventListener('select', onSelect);
controller2.addEventListener('select', onSelect);

const btnAR = document.getElementById('btnAR');
async function startAR() {
  if (!navigator.xr) { alert('Este navegador no soporta WebXR. Ábrelo en el navegador de las Meta Quest.'); return; }
  const arOK = await navigator.xr.isSessionSupported('immersive-ar');
  const mode = arOK ? 'immersive-ar' : 'immersive-vr';
  const session = await navigator.xr.requestSession(mode, {
    requiredFeatures: ['local-floor'],
    optionalFeatures: ['hit-test']
  });
  renderer.xr.setReferenceSpaceType('local-floor');
  await renderer.xr.setSession(session);
  scene.background = null; grid.visible = false;
  if (arOK && session.enabledFeatures?.includes('hit-test') !== false) {
    try {
      const viewer = await session.requestReferenceSpace('viewer');
      hitSource = await session.requestHitTestSource({ space: viewer });
    } catch (e) { hitSource = null; }
  }
  if (!hitSource) { pivot.position.set(0, 0, -3); placed = true; updateShadow(); }
  else { pivot.visible = false; placed = false; }
  session.addEventListener('end', () => {
    hitSource = null; reticle.visible = false; pivot.visible = true;
    pivot.position.set(0, 0, 0); updateShadow();
    scene.background = new THREE.Color(0x1b1b1f); grid.visible = true;
  });
}
btnAR.onclick = startAR;

// Joystick para girar y botón A para escala
let lastA = false, lastStick = 0;
function handleGamepads() {
  const session = renderer.xr.getSession();
  if (!session) return;
  for (const src of session.inputSources) {
    const gp = src.gamepad; if (!gp) continue;
    const x = gp.axes[2] ?? 0;
    if (Math.abs(x) > 0.6 && performance.now() - lastStick > 250) {
      rotate(x > 0 ? -Math.PI / 12 : Math.PI / 12); lastStick = performance.now();
    }
    const a = gp.buttons[4]?.pressed;
    if (src.handedness === 'right') {
      if (a && !lastA) setScale((scaleIdx + 1) % SCALES.length);
      lastA = !!a;
    }
  }
}

renderer.setAnimationLoop((t, frame) => {
  if (frame && hitSource) {
    const ref = renderer.xr.getReferenceSpace();
    const hits = frame.getHitTestResults(hitSource);
    if (hits.length) {
      reticle.visible = true;
      reticle.matrix.fromArray(hits[0].getPose(ref).transform.matrix);
    } else reticle.visible = false;
  }
  handleGamepads();
  controls.update();
  renderer.render(scene, camera);
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});
</script>
</body>
</html>
